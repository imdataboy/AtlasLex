name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run ruff check src tests examples
      - run: uv run pytest -m "not integration"
