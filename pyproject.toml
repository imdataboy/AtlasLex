[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "atlaslex"
version = "0.1.0"
description = "AtlasLex — Moroccan Commercial Law RAG"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = [
  "pdfplumber==0.11.9",
  "qdrant-client==1.17.1",
  "sentence-transformers==5.3.0",
  "transformers==5.3.0",
  "torch==2.10.0",
  "rank-bm25==0.2.2",
  "google-genai==1.67.0",
  "python-dotenv==1.2.2",
]

[project.scripts]
atlaslex = "atlaslex.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.15.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/atlaslex"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires a running Qdrant server"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
